name: test_mobile
description: "Standalone TEST mobile demo application (offline)"
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: ^3.6.0

dependencies:
  file_picker: ^8.3.6
  flutter:
    sdk: flutter
  font_awesome_flutter: ^10.8.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  provider: ^6.1.2
  shared_preferences: ^2.5.1
  url_launcher: ^6.0.12
  syncfusion_flutter_pdfviewer: ^28.2.11
  device_info_plus: ^11.3.0
  carousel_slider: ^5.0.0
  flutter_secure_storage: ^9.2.4
  flutter_screen_capture: ^1.2.3
  screen_capture_restrictions: ^1.1.0
  image_picker: ^1.1.2
  flutter_screenutil: ^5.9.3
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.3"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-BoldItalic.ttf
          weight: 700
          style: italic

  assets:
    - assets/
